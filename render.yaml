# Render 배포 설정 (백엔드 Express 서버)
# Render 대시보드 → New → Blueprint 에서 이 저장소를 고르면 아래 설정으로 서비스가 만들어짐.
# 인증키(sync: false)는 GitHub에 올리지 않고 Render 화면에서 직접 입력함.
services:
  - type: web
    name: dropspot-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOUSEHOLD_WASTE_SERVICE_KEY
        sync: false
      - key: WASTE_ITEM_SERVICE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
